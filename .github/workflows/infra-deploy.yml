name: Deploy infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Validate Bicep
        run: az bicep build --file infra/main.bicep
      - name: Deploy resources
        run: |
          az deployment group create \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters namePrefix="${{ vars.NAME_PREFIX || 'handbollsbanken' }}" \
              globalAdminEmails="${{ vars.GLOBAL_ADMIN_EMAILS || '' }}" \
              googleClientId="${{ secrets.GOOGLE_CLIENT_ID || '' }}" \
              googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET || '' }}" \
            --query "properties.outputs.{webApp:staticWebAppUrl.value,storage:storageAccountName.value}" \
            --output table
